<!-- Save this inside your Django templates folder, e.g., templates/myvepower/nfl_games.html -->

<div class="games-grid">
    {% if nfl_games %}
        {% for game in nfl_games %}
        <div class="game-card">
          <div class="card-img-placeholder">
            <span class="card-badge" {% if game.status == 'Final' %}style="background: #333; color: white;"{% endif %}>
                {{ game.status }}
            </span>
            <div style="font-size: 1.5rem; font-weight: bold; color: var(--text-main);">
                {{ game.week }}
            </div>
          </div>
          
          <div class="card-content">
            <h3 class="card-title">{{ game.away_team }} @ {{ game.home_team }}</h3>
            
            <div class="card-stats">
              <div class="stat-item">
                <span class="stat-label">{{ game.away_abbr }} Score</span>
                <span class="stat-value" style="color: var(--accent);">{{ game.away_score }}</span>
              </div>
              <div class="stat-item">
                <span class="stat-label">{{ game.home_abbr }} Score</span>
                <span class="stat-value" style="color: var(--accent);">{{ game.home_score }}</span>
              </div>
            </div>
            
            <button class="card-action">View Game Odds</button>
          </div>
        </div>
        {% endfor %}
    {% else %}
        <p style="color: var(--text-muted)">No live games found right now.</p>
    {% endif %}
</div>
