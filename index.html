<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyVepower | Live Games Section</title>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0a0a0a;
      --bg-surface: #121212;
      --bg-surface-hover: #1e1e1e;
      --bg-sidebar: #0f0f0f;
      --text-main: #f5f5f5;
      --text-muted: #a0a0a0;
      --accent: #e8b923;
      --border: #2a2a2a;
      --sidebar-width: 260px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-base); color: var(--text-main); font-family: 'Red Hat Display', sans-serif; display: flex; min-height: 100vh; overflow-x: hidden; }
    
    /* Sidebar */
    .sidebar { width: var(--sidebar-width); background-color: var(--bg-sidebar); border-right: 1px solid var(--border); padding: 20px 0; position: fixed; top: 0; left: 0; height: 100vh; overflow-y: auto; z-index: 10; }
    .sidebar-section { padding: 0 20px; margin-bottom: 30px; }
    .sidebar-title { font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 15px; font-weight: 600; }
    .sidebar-nav { list-style: none; }
    .sidebar-nav li { margin-bottom: 8px; }
    .sidebar-nav a { color: var(--text-main); text-decoration: none; font-size: 1rem; display: flex; align-items: center; padding: 10px 12px; border-radius: 8px; transition: background 0.2s; }
    .sidebar-nav a:hover, .sidebar-nav a.active { background-color: var(--bg-surface-hover); color: var(--accent); }

    /* Main Content & Ticker */
    .main-content { flex: 1; margin-left: var(--sidebar-width); display: flex; flex-direction: column; }
    .ticker { background-color: var(--bg-surface); border-bottom: 1px solid var(--border); padding: 10px 20px; overflow: hidden; white-space: nowrap; }
    .ticker-track { display: inline-flex; gap: 30px; animation: scroll 30s linear infinite; }
    .ticker-item { display: inline-flex; align-items: center; gap: 10px; font-size: 0.9rem; }
    .ticker-item .win { color: #4ade80; font-weight: bold; }
    @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

    /* Hero */
    .hero { padding: 60px 40px; text-align: center; background: radial-gradient(circle at center, #1a1a1a 0%, var(--bg-base) 100%); border-bottom: 1px solid var(--border); }
    .hero h1 { font-size: 2.5rem; margin-bottom: 10px; font-weight: 800; }
    .hero .accent { color: var(--accent); }
    .hero-sub { color: var(--text-muted); margin-bottom: 30px; font-size: 1.1rem; }
    .search-wrap { max-width: 600px; margin: 0 auto; position: relative; }
    .search-input { width: 100%; padding: 16px 20px 16px 50px; border-radius: 30px; border: 1px solid var(--border); background-color: var(--bg-surface); color: var(--text-main); font-size: 1rem; outline: none; }
    .search-input:focus { border-color: var(--accent); }

    /* Grid Section */
    .games-section { padding: 40px; max-width: 1400px; margin: 0 auto; width: 100%; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .section-header h2 { font-size: 1.8rem; }
    .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
    
    .game-card { background-color: var(--bg-surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column;}
    .game-card:hover { transform: translateY(-5px); border-color: #333; }
    .card-img-placeholder { height: 160px; background: #2a2a2a; position: relative; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-weight: 600; }
    .card-badge { position: absolute; top: 15px; right: 15px; background: var(--accent); color: #111; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; z-index: 2;}
    .card-content { padding: 20px; flex: 1; display: flex; flex-direction: column;}
    .card-title { font-size: 1.25rem; margin-bottom: 10px; font-weight: 700; }
    .card-stats { display: flex; justify-content: space-between; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
    .stat-item { display: flex; flex-direction: column; }
    .stat-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
    .stat-value { font-size: 1.1rem; font-weight: 600; }
    .card-action { width: 100%; padding: 12px; background-color: transparent; border: 1px solid var(--accent); color: var(--accent); border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: auto;}
    .card-action:hover { background-color: var(--accent); color: #111; }

    /* Loading Spinner */
    .loader { border: 4px solid var(--border); border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 40px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-left: 0; }
    }
  </style>
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <h3 style="color: var(--accent); font-size: 1.5rem; font-weight: 800; margin-bottom: 40px; padding: 10px 12px;">MyVepower</h3>
      <div class="sidebar-title">Categories</div>
      <ul class="sidebar-nav">
        <li><a href="#" class="active">Top Sweepstakes</a></li>
        <li><a href="#">Fish Games</a></li>
        <li><a href="#">Slots</a></li>
      </ul>
    </div>
  </aside>

  <main class="main-content">

    <div class="hero">
      <h1>Your Sweepstakes <span class="accent">Command Center</span></h1>
      <p class="hero-sub">Discover top games, track jackpots, and find the best bonuses.</p>
      <div class="search-wrap">
        <input type="search" class="search-input" placeholder="Search for platforms or games...">
      </div>
    </div>

    <div class="games-section">
      <div class="section-header">
        <h2>Live Platforms</h2>
        <div style="color: var(--text-muted); font-size: 0.9rem;" id="last-updated">Updating...</div>
      </div>

      <!-- This grid will be populated by JavaScript -->
      <div class="games-grid" id="games-grid">
        <div class="loader"></div>
      </div>
    </div>
  </main>

  <script>

    const gridContainer = document.getElementById('games-grid');
    const updateLabel = document.getElementById('last-updated');

    // Function to render HTML cards dynamically from an array of objects
    function renderCards(dataItems) {
      gridContainer.innerHTML = ''; // Clear loading spinner
      
      if (!dataItems || dataItems.length === 0) {
        gridContainer.innerHTML = '<p style="color: var(--text-muted)">No platforms found.</p>';
        return;
      }

      dataItems.forEach(item => {
        const badgeHTML = item.badge ? `<span class="card-badge" ${item.badge === 'Hot' ? 'style="background:#ef4444;color:#fff"' : ''}>${item.badge}</span>` : '';
        
        const cardHTML = `
          <div class="game-card">
            <div class="card-img-placeholder">
              ${item.imageUrl ? `<img src="${item.imageUrl}" style="width:100%; height:100%; object-fit:cover; opacity:0.6;">` : '[ Logo ]'}
              ${badgeHTML}
            </div>
            <div class="card-content">
              <h3 class="card-title">${item.name}</h3>
              <div class="card-stats">
                <div class="stat-item">
                  <span class="stat-label">Welcome Bonus</span>
                  <span class="stat-value" style="color: var(--accent);">${item.bonus}</span>
                </div>
                <div class="stat-item">
                  <span class="stat-label">Win Rate</span>
                  <span class="stat-value">${item.rtp}</span>
                </div>
              </div>
              <button class="card-action" onclick="window.open('${item.link || '#'}', '_blank')">Play Now</button>
            </div>
          </div>
        `;
        gridContainer.insertAdjacentHTML('beforeend', cardHTML);
      });
      
      const now = new Date();
      updateLabel.innerText = 'Last updated: ' + now.toLocaleTimeString();
    }

    // Main Live Data Initialization
    async function initLiveData() {
      // Show loader
      gridContainer.innerHTML = '<div class="loader"></div>';
      
      // In a real scenario, you would call one of the approaches above:

        // Fetching dummy posts to simulate dynamic data
        const res = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=4');

  </script>
</body>
</html>
